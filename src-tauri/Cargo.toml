[package]
name = "tax-evidence-pack"
version = "0.1.4"
description = "A private local evidence binder for tax review"
authors = ["Sociobot"]
edition = "2021"

[lib]
name = "tax_evidence_pack_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tax-evidence-pack"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
pbkdf2 = "0.12"
rand = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

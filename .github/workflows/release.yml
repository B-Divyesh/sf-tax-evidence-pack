name: Release desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install desktop and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: cargo test --manifest-path src-tauri/Cargo.toml
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install macOS build target
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          uploadRelease: false
          args: --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create checksums and release manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          mkdir release-assets
          find . -type f \( -iname '*.dmg' -o -iname '*.msi' -o -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' \) -exec cp {} release-assets/ \;
          sha256sum release-assets/* > release-assets/SHA256SUMS
          node <<'NODE'
          const { readdirSync, readFileSync, writeFileSync } = require('node:fs');
          const { join, basename } = require('node:path');
          const files = [];
          const walk = (dir) => readdirSync(dir, { withFileTypes: true }).forEach((entry) => entry.isDirectory() ? walk(join(dir, entry.name)) : files.push(join(dir, entry.name)));
          walk('release-assets');
          const sums = new Map(readFileSync('release-assets/SHA256SUMS', 'utf8').trim().split('\n').map((line) => { const [sha, path] = line.split(/\s+\*?/); return [basename(path), sha]; }));
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GITHUB_REF_NAME;
          const url = (name) => `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(name)}`;
          const platform = (name) => name.endsWith('.dmg') ? 'macos' : /\.(msi|exe)$/i.test(name) ? 'windows' : /\.(AppImage|deb)$/i.test(name) ? 'linux' : null;
          const platforms = { macos: { label: 'macOS', signed: false, artifacts: [] }, windows: { label: 'Windows', signed: false, artifacts: [] }, linux: { label: 'Linux', signed: false, artifacts: [] } };
          for (const file of files) { const name = basename(file); const key = platform(name); if (!key) continue; const signature = files.find((candidate) => basename(candidate) === `${name}.sig` || basename(candidate) === `${name}.minisig`); platforms[key].artifacts.push({ name, url: url(name), sha256: sums.get(name) ?? null, signature: signature ? url(basename(signature)) : null, signed: Boolean(signature) }); }
          for (const [key, entry] of Object.entries(platforms)) { const preferred = entry.artifacts.find((asset) => key === 'macos' ? /aarch64|arm64/i.test(asset.name) : key === 'windows' ? asset.name.endsWith('.msi') : asset.name.endsWith('.AppImage')) ?? entry.artifacts[0]; if (preferred) Object.assign(entry, preferred); }
          if (platforms.macos.artifacts.length < 2 || !platforms.macos.artifacts.some((asset) => /aarch64|arm64/i.test(asset.name)) || !platforms.macos.artifacts.some((asset) => /x86_64|x64|intel/i.test(asset.name)) || !platforms.windows.artifacts.length || !platforms.linux.artifacts.length) throw new Error('A required desktop platform artifact is missing.');
          writeFileSync('release-assets/latest.json', `${JSON.stringify({ schema: 1, published: true, version: tag.replace(/^v/, ''), release_url: `https://github.com/${repo}/releases/tag/${tag}`, generated_at: new Date().toISOString(), platforms }, null, 2)}\n`);
          NODE
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/release-assets/*

name: Release desktop app
on: { push: { tags: ['v*'] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    strategy: { fail-fast: false, matrix: { include: [{ os: macos-13, target: x86_64-apple-darwin, label: macos-x64 }, { os: macos-14, target: aarch64-apple-darwin, label: macos-arm64 }, { os: windows-latest, target: x86_64-pc-windows-msvc, label: windows-x64 }, { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, label: linux-x64 }] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} }
        with: { uploadRelease: false, args: --target ${{ matrix.target }} }
      - uses: actions/upload-artifact@v4
        with: { name: ${{ matrix.label }}, path: src-tauri/target/${{ matrix.target }}/release/bundle/**, if-no-files-found: error }
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Create checksums and manifest
        shell: bash
        run: |
          set -euo pipefail; cd artifacts; find . -type f -print0 | xargs -0 sha256sum > SHA256SUMS
          mac=$(find . -iname '*.dmg' | head -1); win=$(find . -iname '*.msi' | head -1); linux=$(find . -iname '*.AppImage' | head -1)
          url(){ printf 'https://github.com/%s/%s/releases/download/%s/%s' "$GITHUB_REPOSITORY_OWNER" "${GITHUB_REPOSITORY#*/}" "$GITHUB_REF_NAME" "$(basename "$1")"; }; sha(){ sha256sum "$1"|awk '{print $1}'; }
          printf '{"version":"%s","platforms":{"macos":{"url":"%s","sha256":"%s"},"windows":{"url":"%s","sha256":"%s"},"linux":{"url":"%s","sha256":"%s"}}}\n' "${GITHUB_REF_NAME#v}" "$(url "$mac")" "$(sha "$mac")" "$(url "$win")" "$(sha "$win")" "$(url "$linux")" "$(sha "$linux")" > latest.json
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true, files: artifacts/** }
